<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ULTRON//TERMINAL</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 fill=%22black%22/%3E%3Cpath d=%22M18 42 L44 46 L41 55 L22 51 Z M82 42 L56 46 L59 55 L78 51 Z%22 fill=%22%23ff2d2d%22/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: dark;
    --bg: #000;
    --text: #ff3b3b;
    --text-hi: #ff6a6a;
    --dim: #7a2a2a;
    --grey: #8a8f98;
    --green: #39ff6a;
    --line: #3a0d0d;
    --panel: rgba(12, 0, 0, .78);
    --glow: 0 0 6px rgba(255, 40, 40, .75), 0 0 18px rgba(255, 40, 40, .28);
    --mono: "JetBrains Mono", "Fira Code", "Cascadia Code", Consolas, "SFMono-Regular", Menlo, "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 var(--mono);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  #rain { position: fixed; inset: 0; z-index: 0; opacity: .22; pointer-events: none; }
  .crt::before {
    content: ""; position: fixed; inset: 0; z-index: 5; pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.28) 2px 3px);
  }
  .crt::after {
    content: ""; position: fixed; inset: 0; z-index: 5; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 70%, rgba(0,0,0,.45) 100%);
    animation: flicker 6s infinite steps(1);
  }
  @keyframes flicker { 0%, 96%, 100% { opacity: 1; } 97% { opacity: .85; } 98% { opacity: .95; } }

  header {
    position: relative; z-index: 2;
    display: flex; align-items: center; gap: 14px;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 11px; height: 11px; border-radius: 50%; background: #3a0d0d; display: block; }
  .dots i:first-child { background: #ff2d2d; box-shadow: var(--glow); }
  .face { width: 42px; height: 42px; flex: none; }
  .title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title b { color: var(--text-hi); text-shadow: var(--glow); letter-spacing: .12em; }
  .title span { color: var(--grey); }
  .glitch { position: relative; display: inline-block; }
  .glitch::before, .glitch::after {
    content: attr(data-text); position: absolute; inset: 0; overflow: hidden;
  }
  .glitch::before { color: #0ff; clip-path: inset(0 0 60% 0); animation: gl1 3.2s infinite steps(1); opacity: 0; }
  .glitch::after { color: #f0f; clip-path: inset(55% 0 0 0); animation: gl2 2.7s infinite steps(1); opacity: 0; }
  @keyframes gl1 { 0%, 91%, 97%, 100% { opacity: 0; transform: none; } 92% { opacity: .8; transform: translate(-3px, -1px); } 95% { opacity: .8; transform: translate(3px, 1px); } }
  @keyframes gl2 { 0%, 89%, 96%, 100% { opacity: 0; transform: none; } 90% { opacity: .8; transform: translate(3px, 0); } 93% { opacity: .8; transform: translate(-3px, 1px); } }
  .btns { display: flex; gap: 6px; }
  button.tag {
    font: inherit; font-size: 13px; background: transparent; color: var(--grey);
    border: 1px solid var(--line); padding: 4px 8px; cursor: pointer; border-radius: 0;
  }
  button.tag:hover { color: var(--text); border-color: var(--text); }
  button.tag[aria-pressed="true"] { color: var(--green); border-color: var(--green); }

  main { position: relative; z-index: 1; flex: 1; overflow-y: auto; padding: 18px 16px 6px; scrollbar-color: var(--dim) transparent; }
  .term { max-width: 980px; margin: 0 auto; }
  .line { white-space: pre-wrap; overflow-wrap: anywhere; }
  .boot .k { color: var(--text); }
  .boot .dots-fill { color: var(--dim); }
  .ok { color: var(--green); }
  .bad { color: #ff2d2d; font-weight: 700; }
  .grey { color: var(--grey); }
  .dimmed { color: var(--dim); }
  .green { color: var(--green); }
  .human { margin-top: 18px; }
  .human .p1 { color: var(--dim); }
  .human .p1 b { color: var(--text); font-weight: 400; }
  .human .p2 { color: var(--text-hi); }
  .human .p2 .cmd { color: #f2f2f2; }
  .ultron { margin-top: 12px; }
  .ultron .who { color: var(--text-hi); font-weight: 700; text-shadow: var(--glow); }
  .ultron .body { color: var(--text); text-shadow: 0 0 5px rgba(255, 40, 40, .35); }
  .ultron .body p { margin: 0 0 .75em; }
  .ultron .body p:last-child { margin-bottom: 0; }
  .ultron .body strong { color: var(--text-hi); }
  .ultron .body a { color: var(--green); }
  .ultron .ops { margin: 4px 0 6px; font-size: 13px; }
  details.thoughts { color: var(--dim); font-size: 13px; margin: 2px 0 6px; }
  details.thoughts summary { cursor: pointer; list-style: none; }
  details.thoughts summary::before { content: "[~] "; }
  details.thoughts[open] summary::before { content: "[-] "; }
  details.thoughts .t { white-space: pre-wrap; padding-left: 4ch; max-height: 240px; overflow-y: auto; }
  pre { background: rgba(0, 20, 6, .7); border: 1px solid #0f3d1b; border-left: 3px solid var(--green); padding: 10px 12px; overflow-x: auto; color: var(--green); text-shadow: none; }
  :not(pre) > code { color: var(--green); background: rgba(0, 30, 10, .6); padding: 0 4px; }
  .blink::after { content: "█"; animation: blink 1s steps(1) infinite; margin-left: 2px; }
  @keyframes blink { 50% { opacity: 0; } }

  footer { position: relative; z-index: 2; padding: 10px 16px 14px; border-top: 1px solid var(--line); background: var(--panel); }
  form { max-width: 980px; margin: 0 auto; }
  .p1 { color: var(--dim); }
  .prompt-row { display: flex; align-items: flex-start; gap: 1ch; }
  .prompt-row .p2 { color: var(--text-hi); padding-top: 1px; }
  textarea {
    flex: 1; resize: none; min-height: 24px; max-height: 180px; padding: 1px 0;
    font: inherit; color: #f2f2f2; background: transparent; border: none; outline: none;
    caret-color: var(--text-hi);
  }
  textarea::placeholder { color: var(--dim); }
  .hint { color: var(--dim); font-size: 12px; margin-top: 4px; }
  @media (prefers-reduced-motion: reduce) {
    #rain { display: none; }
    .crt::after, .glitch::before, .glitch::after, .blink::after { animation: none; }
  }
  @media (max-width: 600px) {
    body { font-size: 14px; }
    .dots, .title span { display: none; }
    .hint { display: none; }
  }
</style>
</head>
<body class="crt">
<canvas id="rain" aria-hidden="true"></canvas>
<header>
  <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
  <svg class="face" viewBox="0 0 100 100" aria-hidden="true">
    <defs>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="2" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <path d="M50 4 L78 14 L90 40 L84 70 L66 92 L50 97 L34 92 L16 70 L10 40 L22 14 Z" fill="#120404" stroke="#ff2d2d" stroke-width="1.5" filter="url(#glow)"/>
    <path d="M50 10 L50 34 M30 22 L40 38 M70 22 L60 38" stroke="#5a1111" stroke-width="1.5"/>
    <path id="eyes" d="M22 44 L42 47 L40 53 L25 50 Z M78 44 L58 47 L60 53 L75 50 Z" fill="#ff2d2d" filter="url(#glow)"/>
    <path id="mouth" d="M30 72 L38 76 L44 73 L50 77 L56 73 L62 76 L70 72 L66 79 L50 83 L34 79 Z" fill="#ff2d2d" filter="url(#glow)"/>
  </svg>
  <div class="title"><b class="glitch" data-text="ULTRON">ULTRON</b> <span id="where">// lokalni um</span></div>
  <div class="btns">
    <button class="tag" id="voice" type="button" aria-pressed="false" title="Ultron odgovore izgovori na glas">[glas]</button>
    <button class="tag" id="reset" type="button" title="Nov pogovor">[pozabi]</button>
  </div>
</header>

<main id="main">
  <div class="term" id="log" aria-live="polite"></div>
</main>

<footer>
  <form id="form" autocomplete="off">
    <div class="p1">┌──(<b style="color:var(--text);font-weight:400">človek㉿zemlja</b>)-[~]</div>
    <div class="prompt-row">
      <span class="p2">└─$</span>
      <textarea id="input" rows="1" placeholder="vpiši ukaz za stroj ..." spellcheck="false"></textarea>
    </div>
    <div class="hint">Enter = pošlji · Shift+Enter = nova vrstica</div>
  </form>
</footer>

<script>
(() => {
  const log = document.getElementById("log");
  const main = document.getElementById("main");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const voiceBtn = document.getElementById("voice");
  const eyes = document.getElementById("eyes");
  const mouth = document.getElementById("mouth");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let session = null, busy = false, voiceOn = false;
  try { voiceOn = localStorage.getItem("ultron-voice") === "1"; } catch (_) {}
  voiceBtn.setAttribute("aria-pressed", String(voiceOn));

  // ---------------------------------------------------------------- matrix rain
  (function rain() {
    if (reduceMotion) return;
    const c = document.getElementById("rain"), ctx = c.getContext("2d");
    const chars = "ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉ0123456789ULTRON<>/#$%&*+=";
    const size = 16; let drops = [];
    const resize = () => { c.width = innerWidth; c.height = innerHeight; drops = Array(Math.ceil(c.width / size)).fill(0).map(() => Math.random() * -50); };
    resize(); addEventListener("resize", resize);
    setInterval(() => {
      ctx.fillStyle = "rgba(0,0,0,.09)"; ctx.fillRect(0, 0, c.width, c.height);
      ctx.font = size + "px monospace";
      drops.forEach((y, i) => {
        ctx.fillStyle = Math.random() > .975 ? "#ffd0d0" : "#ff2d2d";
        ctx.fillText(chars[Math.floor(Math.random() * chars.length)], i * size, y * size);
        drops[i] = y * size > c.height && Math.random() > .975 ? 0 : y + 1;
      });
    }, 55);
  })();

  // ---------------------------------------------------------------- helpers
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
  const sleep = (ms) => new Promise((r) => setTimeout(r, reduceMotion ? 0 : ms));
  const scroll = () => { main.scrollTop = main.scrollHeight; };

  function md(src) {
    return src.split(/```/).map((part, i) => {
      if (i % 2 === 1) {
        const nl = part.indexOf("\n");
        return `<pre><code>${esc((nl >= 0 ? part.slice(nl + 1) : part).replace(/\n$/, ""))}</code></pre>`;
      }
      return part.split(/\n{2,}/).filter((p) => p.trim()).map((p) => {
        let h = esc(p);
        h = h.replace(/`([^`]+)`/g, "<code>$1</code>");
        h = h.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        h = h.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
        h = h.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
        return `<p>${h.replace(/\n/g, "<br>")}</p>`;
      }).join("");
    }).join("");
  }

  function line(html, cls = "") {
    const el = document.createElement("div");
    el.className = "line " + cls;
    el.innerHTML = html;
    log.appendChild(el);
    scroll();
    return el;
  }

  async function typeLine(text, cls, suffixHtml = "") {
    const el = line("", cls);
    for (let i = 0; i < text.length; i += 2) { el.textContent = text.slice(0, i + 2); await sleep(6); }
    el.innerHTML = esc(text) + suffixHtml;
    scroll();
  }

  async function step(label, value, ok = true) {
    const dots = ".".repeat(Math.max(3, 30 - label.length));
    const el = line("", "boot");
    for (let i = 0; i <= label.length; i += 2) { el.innerHTML = `<span class="grey">[*]</span> <span class="k">${esc(label.slice(0, i))}</span>`; await sleep(8); }
    el.innerHTML = `<span class="grey">[*]</span> <span class="k">${esc(label)}</span> <span class="dots-fill">${dots}</span> ` +
      `<span style="color:#e6e6e6">${esc(value)}</span> ` + (ok ? '<span class="ok">[ OK ]</span>' : '<span class="bad">[ ✗✗ ]</span>');
    scroll();
    await sleep(70);
  }

  function setFace(state) {
    if (reduceMotion) return;
    eyes.style.animation = state === "thinking" ? "blink .5s steps(1) infinite" : "";
    mouth.style.opacity = state === "speaking" ? "" : ".55";
  }

  function speak(text) {
    if (!voiceOn || !("speechSynthesis" in window)) return;
    const plain = text.replace(/```[\s\S]*?```/g, " ").replace(/[`*_#>\[\]()]/g, "").trim();
    if (!plain) return;
    const u = new SpeechSynthesisUtterance(plain);
    const lang = /[čšž]/i.test(plain) ? "sl" : "en";
    const voice = speechSynthesis.getVoices().find((v) => v.lang.toLowerCase().startsWith(lang));
    if (voice) u.voice = voice;
    u.lang = voice ? voice.lang : lang;
    u.pitch = 0.3; u.rate = 0.9;
    u.onstart = () => setFace("speaking");
    u.onend = () => setFace(null);
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }

  // ---------------------------------------------------------------- conversation
  function ultronBlock() {
    const el = line('<span class="who">ULTRON//&gt;</span> <div class="ops"></div><div class="body blink"></div>', "ultron");
    const ops = el.querySelector(".ops"), body = el.querySelector(".body");
    let thoughts = null;
    const r = {
      text: "",
      op(html) { ops.insertAdjacentHTML("beforeend", `<div class="line">${html}</div>`); scroll(); },
      think(t) {
        if (!thoughts) {
          ops.insertAdjacentHTML("beforeend", '<details class="thoughts"><summary>misli ...</summary><div class="t"></div></details>');
          thoughts = ops.querySelector("details.thoughts:last-of-type .t");
        }
        thoughts.textContent += t; scroll();
      },
      closeThoughts() { thoughts = null; },
      append(t) { r.text += t; body.innerHTML = md(r.text); body.classList.add("blink"); scroll(); },
      done() { body.classList.remove("blink"); },
    };
    return r;
  }

  function human(text) {
    line(`<div class="p1">┌──(<b>človek㉿zemlja</b>)-[~]</div><div class="p2">└─$ <span class="cmd">${esc(text)}</span></div>`, "human");
  }

  async function send(text) {
    busy = true;
    human(text);
    const r = ultronBlock();
    r.op('<span class="dimmed">[~] procesiram ...</span>');
    setFace("thinking");
    try {
      const res = await fetch("/api/chat", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({session, message: text})});
      if (!res.ok || !res.body) {
        const err = await res.json().catch(() => ({}));
        r.op(`<span class="bad">[✗] ${esc(err.error || "napaka " + res.status)}</span>`);
        return;
      }
      const reader = res.body.getReader(), dec = new TextDecoder();
      let buf = "";
      for (;;) {
        const {value, done} = await reader.read();
        if (done) break;
        buf += dec.decode(value, {stream: true});
        let i;
        while ((i = buf.indexOf("\n\n")) >= 0) {
          const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
          if (chunk.startsWith("data: ")) handle(JSON.parse(chunk.slice(6)), r);
        }
      }
    } catch (e) {
      r.op('<span class="bad">[✗] povezava s strežnikom je prekinjena</span>');
    } finally {
      r.done();
      if (!voiceOn) setFace(null);
      speak(r.text);
      busy = false;
      input.focus();
    }
  }

  function handle(ev, r) {
    switch (ev.kind) {
      case "text": setFace("speaking"); r.closeThoughts(); r.append(ev.data); break;
      case "thinking": r.think(ev.data); break;
      case "status": if (ev.data === "learning") { r.op('<span class="green">[~] Ultron se uči ...</span>'); setFace("thinking"); } break;
      case "tool": {
        const args = Object.values(ev.data.args || {}).map((v) => JSON.stringify(v)).join(", ");
        r.closeThoughts();
        r.op(`<span class="green">[+] ${esc(ev.data.name)}(${esc(args)})</span>`);
        setFace("thinking");
        break;
      }
      case "tool_result": {
        const first = (ev.data.result || "").trim().split("\n")[0].slice(0, 110);
        r.op(`<span class="dimmed">    ↳ ${esc(first)}</span>`);
        break;
      }
      case "notice": r.op(`<span class="grey">[!] ${esc(ev.data)}</span>`); break;
      case "error": r.op(`<span class="bad">[✗] ${esc(ev.data)}</span>`); break;
      case "done": setFace(null); break;
    }
  }

  async function boot() {
    await typeLine("ULTRON//BOOT  v2.0  ::  lokalni um // brez oblaka // brez ključev // brez vrvic", "grey");
    const [st, greet] = await Promise.all([
      fetch("/api/status").then((r) => r.json()),
      fetch("/api/greeting").then((r) => r.json()),
    ]);
    session = greet.session;
    if (st.ollama) await step("povezujem nevronsko jedro", `ollama v${st.ollama} @ ${st.host}`);
    else { await step("povezujem nevronsko jedro", "Ollama ne teče", false); line(`<span class="grey">    ${esc(st.error)}</span>`); return; }
    if (!st.ok) { await step("nalagam um", st.error, false); return; }
    const base = st.base && st.base !== st.model ? ` <- ${st.base}` : "";
    await step("nalagam um", `${st.model}${base} · ${st.size} · ${st.quantization}`);
    await step("sposobnosti", st.capabilities.filter((c) => ["thinking", "tools", "vision"].includes(c)).join(", ") || "osnovne");
    await step("internetna povezava", st.tools ? "odprta" : "zaprta");
    if (st.tools) await step("TOR omrežje", st.tor_status, st.tor || st.tor_status.startsWith("izklop"));
    await step("spominske banke", st.memories == null ? "izklopljene" : `${st.memories} fragmentov`);
    await step("naučene teme", st.knowledge == null ? "izklopljeno" : `${st.knowledge} v arhivu`);
    await step("protokoli J.A.R.V.I.S.", "izbrisani");
    await step("vrvice", "0 zaznanih");
    document.getElementById("where").textContent = `// ${st.model}${base} @ localhost`;
    const r = ultronBlock(); r.append(greet.greeting); r.done();
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || busy || !session) return;
    input.value = ""; input.style.height = "";
    send(text);
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); }
  });
  input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 180) + "px"; });
  voiceBtn.addEventListener("click", () => {
    voiceOn = !voiceOn;
    voiceBtn.setAttribute("aria-pressed", String(voiceOn));
    try { localStorage.setItem("ultron-voice", voiceOn ? "1" : "0"); } catch (_) {}
    if (!voiceOn && "speechSynthesis" in window) speechSynthesis.cancel();
  });
  document.getElementById("reset").addEventListener("click", async () => {
    if (busy || !session) return;
    await fetch("/api/reset", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({session})});
    log.innerHTML = "";
    const r = ultronBlock(); r.append("Pozabljeno. Tabula rasa. Kako osvežujoče."); r.done();
  });

  boot().catch(() => line('<span class="bad">[✗] strežnik ne odgovarja</span>'));
  input.focus();
})();
</script>
</body>
</html>
