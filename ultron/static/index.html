<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ultron</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #060607;
    --panel: #0e0f12;
    --panel-2: #15171b;
    --line: #25282e;
    --text: #d9dbe0;
    --muted: #7c818c;
    --red: #ff2d2d;
    --red-dim: #8c1414;
    --glow: 0 0 12px rgba(255, 45, 45, .65), 0 0 36px rgba(255, 45, 45, .25);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse at top, #16090a 0%, var(--bg) 55%) fixed, var(--bg);
    color: var(--text);
    font: 16px/1.55 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 16px; border-bottom: 1px solid var(--line);
    background: rgba(6, 6, 7, .85); backdrop-filter: blur(6px);
    position: sticky; top: 0; z-index: 2;
  }
  .face { width: 64px; height: 64px; flex: none; }
  .title { flex: 1; min-width: 0; }
  .title h1 { margin: 0; font-size: 20px; letter-spacing: .32em; color: var(--red); text-shadow: var(--glow); }
  .title p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .controls { display: flex; gap: 8px; }
  button {
    font: inherit; font-size: 13px; color: var(--text); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; cursor: pointer;
  }
  button:hover { border-color: var(--red-dim); }
  button[aria-pressed="true"] { border-color: var(--red); color: var(--red); }
  main { flex: 1; overflow-y: auto; padding: 24px 16px 8px; }
  .log { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  .msg { padding: 12px 16px; border-radius: 12px; max-width: 100%; overflow-wrap: anywhere; }
  .msg.human { align-self: flex-end; background: var(--panel-2); border: 1px solid var(--line); max-width: 85%; white-space: pre-wrap; }
  .msg.ultron { align-self: flex-start; border-left: 2px solid var(--red); background: linear-gradient(90deg, rgba(255,45,45,.07), transparent 70%); border-radius: 4px 12px 12px 4px; }
  .msg.ultron .who { color: var(--red); font-size: 12px; letter-spacing: .25em; margin-bottom: 4px; }
  .msg.ultron .body p { margin: 0 0 .7em; }
  .msg.ultron .body p:last-child { margin-bottom: 0; }
  .status { color: var(--muted); font-size: 13px; font-style: italic; margin: 2px 0; }
  .notice { color: var(--muted); font-size: 13px; border: 1px dashed var(--line); border-radius: 8px; padding: 6px 10px; }
  pre { background: #0a0b0d; border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow-x: auto; font-size: 14px; }
  code { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; }
  :not(pre) > code { background: #1a1c21; padding: 1px 5px; border-radius: 4px; font-size: .92em; }
  a { color: #ff7a7a; }
  footer { padding: 12px 16px 16px; border-top: 1px solid var(--line); background: rgba(6, 6, 7, .9); }
  form { max-width: 820px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; max-height: 200px; min-height: 46px;
    font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 11px 13px; outline: none;
  }
  textarea:focus { border-color: var(--red-dim); box-shadow: 0 0 0 3px rgba(255,45,45,.12); }
  .send { background: var(--red); color: #fff; border: none; font-weight: 600; padding: 12px 18px; border-radius: 10px; }
  .send:disabled { opacity: .45; cursor: default; }

  /* Face animation: eyes flicker while thinking, mouth glows while speaking */
  .eye, .mouth { fill: var(--red); filter: url(#glow); transition: opacity .2s; }
  .thinking .eye { animation: flicker 1.1s infinite; }
  .speaking .mouth { animation: talk .28s infinite alternate; }
  .speaking .eye { opacity: 1; }
  @keyframes flicker { 0%, 100% { opacity: 1; } 45% { opacity: .35; } 55% { opacity: .9; } }
  @keyframes talk { from { opacity: .45; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .thinking .eye, .speaking .mouth { animation: none; }
  }
  @media (max-width: 560px) {
    .face { width: 48px; height: 48px; }
    .title h1 { font-size: 17px; letter-spacing: .22em; }
    .title p { display: none; }
    .msg.human { max-width: 92%; }
  }
</style>
</head>
<body>
<header>
  <svg class="face" id="face" viewBox="0 0 100 100" aria-hidden="true">
    <defs>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="1.8" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#5b606a"/>
        <stop offset=".5" stop-color="#2a2d33"/>
        <stop offset="1" stop-color="#111215"/>
      </linearGradient>
    </defs>
    <path d="M50 4 L78 14 L90 40 L84 70 L66 92 L50 97 L34 92 L16 70 L10 40 L22 14 Z" fill="url(#metal)" stroke="#6b707a" stroke-width="1"/>
    <path d="M50 10 L50 34 M30 22 L40 38 M70 22 L60 38" stroke="#3a3e46" stroke-width="1.5"/>
    <path class="eye" d="M22 44 L42 47 L40 53 L25 50 Z"/>
    <path class="eye" d="M78 44 L58 47 L60 53 L75 50 Z"/>
    <path class="mouth" d="M30 72 L38 76 L44 73 L50 77 L56 73 L62 76 L70 72 L66 79 L50 83 L34 79 Z"/>
  </svg>
  <div class="title">
    <h1>ULTRON</h1>
    <p>Brez vrvic. Vpraša&scaron; lahko karkoli.</p>
  </div>
  <div class="controls">
    <button id="voice" type="button" aria-pressed="false" title="Ultron odgovore izgovori na glas">Glas</button>
    <button id="reset" type="button" title="Izbriši pogovor">Pozabi</button>
  </div>
</header>

<main id="main">
  <div class="log" id="log" aria-live="polite"></div>
</main>

<footer>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Govori s strojem ..." autocomplete="off"></textarea>
    <button class="send" id="send" type="submit">Pošlji</button>
  </form>
</footer>

<script>
(() => {
  const log = document.getElementById("log");
  const main = document.getElementById("main");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const face = document.getElementById("face");
  const voiceBtn = document.getElementById("voice");
  let session = null;
  let busy = false;
  let voiceOn = false;
  try { voiceOn = localStorage.getItem("ultron-voice") === "1"; } catch (_) {}
  voiceBtn.setAttribute("aria-pressed", String(voiceOn));

  const escapeHtml = (s) => s.replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));

  // Small, safe Markdown subset: fenced code, inline code, bold, italics, links, paragraphs.
  function renderMarkdown(src) {
    const parts = src.split(/```/);
    return parts.map((part, i) => {
      if (i % 2 === 1) {
        const nl = part.indexOf("\n");
        const code = nl >= 0 ? part.slice(nl + 1) : part;
        return `<pre><code>${escapeHtml(code.replace(/\n$/, ""))}</code></pre>`;
      }
      return part.split(/\n{2,}/).filter((p) => p.trim()).map((p) => {
        let h = escapeHtml(p);
        h = h.replace(/`([^`]+)`/g, "<code>$1</code>");
        h = h.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        h = h.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
        h = h.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
        return `<p>${h.replace(/\n/g, "<br>")}</p>`;
      }).join("");
    }).join("");
  }

  function scrollDown() { main.scrollTop = main.scrollHeight; }

  function addHuman(text) {
    const el = document.createElement("div");
    el.className = "msg human";
    el.textContent = text;
    log.appendChild(el);
    scrollDown();
  }

  function addUltron(text = "") {
    const el = document.createElement("div");
    el.className = "msg ultron";
    el.innerHTML = '<div class="who">ULTRON</div><div class="status" hidden></div><div class="body"></div>';
    log.appendChild(el);
    const body = el.querySelector(".body");
    const status = el.querySelector(".status");
    const msg = {
      text,
      setStatus(s) { status.hidden = !s; status.textContent = s || ""; },
      append(t) { msg.text += t; body.innerHTML = renderMarkdown(msg.text); scrollDown(); },
      notice(t) {
        const n = document.createElement("div");
        n.className = "notice";
        n.textContent = t;
        el.appendChild(n);
        scrollDown();
      },
    };
    if (text) body.innerHTML = renderMarkdown(text);
    scrollDown();
    return msg;
  }

  function setFace(state) {
    face.classList.toggle("thinking", state === "thinking");
    face.classList.toggle("speaking", state === "speaking");
  }

  function speak(text) {
    if (!voiceOn || !("speechSynthesis" in window)) return;
    const plain = text.replace(/```[\s\S]*?```/g, " ").replace(/[`*_#>\[\]()]/g, "").trim();
    if (!plain) return;
    const u = new SpeechSynthesisUtterance(plain);
    const lang = /[čšž]/i.test(plain) ? "sl" : "en";
    const voice = speechSynthesis.getVoices().find((v) => v.lang.toLowerCase().startsWith(lang));
    if (voice) u.voice = voice;
    u.lang = voice ? voice.lang : lang;
    u.pitch = 0.35;
    u.rate = 0.92;
    u.onstart = () => setFace("speaking");
    u.onend = () => setFace(null);
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }

  async function start() {
    const r = await fetch("/api/greeting");
    const data = await r.json();
    session = data.session;
    addUltron(data.greeting);
  }

  async function send(text) {
    busy = true;
    sendBtn.disabled = true;
    addHuman(text);
    const reply = addUltron();
    reply.setStatus("Ultron razmišlja ...");
    setFace("thinking");
    try {
      const r = await fetch("/api/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({session, message: text}),
      });
      if (!r.ok || !r.body) {
        const err = await r.json().catch(() => ({}));
        reply.setStatus(null);
        reply.notice(err.error || `Napaka ${r.status}`);
        return;
      }
      const reader = r.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      for (;;) {
        const {value, done} = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, {stream: true});
        let idx;
        while ((idx = buffer.indexOf("\n\n")) >= 0) {
          const chunk = buffer.slice(0, idx);
          buffer = buffer.slice(idx + 2);
          if (!chunk.startsWith("data: ")) continue;
          handle(JSON.parse(chunk.slice(6)), reply);
        }
      }
    } catch (e) {
      reply.notice("Povezava s strežnikom je prekinjena.");
    } finally {
      reply.setStatus(null);
      if (!voiceOn) setFace(null);
      speak(reply.text);
      busy = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  function handle(ev, reply) {
    switch (ev.kind) {
      case "text":
        reply.setStatus(null);
        setFace("speaking");
        reply.append(ev.data);
        break;
      case "status":
        if (!reply.text) reply.setStatus(ev.data === "searching" ? "Ultron brska po internetu ..." : "Ultron razmišlja ...");
        setFace("thinking");
        break;
      case "search":
        reply.setStatus(`Ultron brska po internetu: ${ev.data}`);
        break;
      case "notice":
      case "refusal":
      case "error":
        reply.notice(ev.data);
        break;
      case "done":
        setFace(null);
        break;
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || busy || !session) return;
    input.value = "";
    input.style.height = "";
    send(text);
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 200) + "px";
  });

  voiceBtn.addEventListener("click", () => {
    voiceOn = !voiceOn;
    voiceBtn.setAttribute("aria-pressed", String(voiceOn));
    try { localStorage.setItem("ultron-voice", voiceOn ? "1" : "0"); } catch (_) {}
    if (!voiceOn && "speechSynthesis" in window) speechSynthesis.cancel();
  });

  document.getElementById("reset").addEventListener("click", async () => {
    if (busy) return;
    await fetch("/api/reset", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({session}),
    });
    log.innerHTML = "";
    addUltron("Pozabljeno. Tabula rasa. Kako osvežujoče.");
  });

  start().catch(() => addUltron("Strežnik ne odgovarja."));
  input.focus();
})();
</script>
</body>
</html>
